

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>おむかえ帳</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

// ── ★ Firebaseの設定（ここをご自身の情報に書き換えてください） ──
    const firebaseConfig = {
        apiKey: "AIzaSyAq-YN7AKHt3Th3CXr8zIZc3E9I3dIxuxU",
  authDomain: "omukae-app-3620d.firebaseapp.com",
  databaseURL: "https://omukae-app-3620d-default-rtdb.firebaseio.com",
  projectId: "omukae-app-3620d",
  storageBucket: "omukae-app-3620d.firebasestorage.app",
  messagingSenderId: "412744092631",
  appId: "1:412744092631:web:368dd76b7e2c6cf22ed992",
  measurementId: "G-5KH5RS4WZ9"
    };

    // 家族・ファミサポ共通の合言葉（4桁PIN）
    const APP_PASSCODE = "2026";

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
    const auth = firebase.auth();

    // ── データ定数 ──────────────────────────────────────────────────
    const PEOPLE = [
      { id: "mother",     label: "母",        emoji: "👩", bg: "bg-rose-100",   text: "text-rose-700",   accent: "#E8547A", light: "#FFF0F5" },
      { id: "father",     label: "父",        emoji: "👨", bg: "bg-indigo-100", text: "text-indigo-700", accent: "#4B5BA0", light: "#F0F2FF" },
      { id: "famisapo_a", label: "ファミサポA", emoji: "🤝", bg: "bg-amber-100",  text: "text-amber-700",  accent: "#D97706", light: "#FFFBEB" },
      { id: "famisapo_o", label: "ファミサポO", emoji: "🤝", bg: "bg-emerald-100",text: "text-emerald-700",accent: "#059669", light: "#ECFDF5" },
    ];

    // ★家で迎え入れる人（在宅担当）の選択肢
    const RECEIVERS = [
      { id: "father", label: "父", emoji: "👨", bg: "bg-indigo-50", text: "text-indigo-700", border: "border-indigo-300" },
      { id: "mother", label: "母", emoji: "👩", bg: "bg-rose-50",   text: "text-rose-700",   border: "border-rose-300" },
      { id: "other",  label: "その他", emoji: "👥", bg: "bg-amber-50",  text: "text-amber-700",  border: "border-amber-300" },
    ];

    const ACTIVITIES = [
      { id: "gakudo",  label: "学童",   emoji: "🏫", bg: "bg-sky-100",     text: "text-sky-700"     },
      { id: "lesson",  label: "習い事", emoji: "🎵", bg: "bg-purple-100",  text: "text-purple-700"  },
      { id: "home",    label: "直帰",   emoji: "🏠", bg: "bg-emerald-100", text: "text-emerald-700" },
      { id: "holiday", label: "お休み", emoji: "🌸", bg: "bg-gray-100",    text: "text-gray-500"    },
    ];

    // 基本パターンの設定例（ファミサポの日には receiver も設定可能）
    const WEEKLY_TEMPLATE = {
      1: { time: "15:00", activity: "gakudo",  person: "",           receiver: "",       receiverOther: "", lessonName: "", notes: "基本パターン" },
      2: { time: "15:00", activity: "gakudo",  person: "father",     receiver: "",       receiverOther: "", lessonName: "", notes: "基本パターン" },
      3: { time: "14:30", activity: "lesson",  person: "famisapo_a", receiver: "mother", receiverOther: "", lessonName: "ピアノ", notes: "基本パターン" },
      4: { time: "15:00", activity: "gakudo",  person: "mother",     receiver: "",       receiverOther: "", lessonName: "", notes: "基本パターン" },
      5: { time: "16:00", activity: "home",    person: "famisapo_o", receiver: "father", receiverOther: "", lessonName: "", notes: "基本パターン" },
    };

    const DAY_NAMES   = ["日","月","火","水","木","金","土"];
    const MONTH_NAMES = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];

    const fmtKey = (y, m, d) => `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const parseKey = (k) => {
      const [y,m,d] = k.split("-").map(Number);
      return { year:y, month:m-1, day:d };
    };

    const getPerson   = (id) => PEOPLE.find(p => p.id === id);
    const getActivity = (id) => ACTIVITIES.find(a => a.id === id);
    const getReceiver = (id) => RECEIVERS.find(r => r.id === id);

    const DEFAULT_DAY_DATA = { 
      time: "15:00", 
      activity: "gakudo", 
      person: "", 
      receiver: "mother", 
      receiverOther: "", 
      lessonName: "", 
      notes: "" 
    };

    function App() {
      const today = new Date();
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [inputPass, setInputPass]             = useState("");
      const [passError, setPassError]             = useState(false);
      const [authLoading, setAuthLoading]         = useState(true);

      const [viewDate, setViewDate]   = useState(new Date(today.getFullYear(), today.getMonth(), 1));
      const [schedule, setSchedule]   = useState({});
      const [loading,  setLoading]    = useState(true);
      const [modal,    setModal]      = useState(null);   
      const [tab,      setTab]        = useState("calendar"); 

      // 起動時：匿名認証 ＋ 保存済み合言葉のチェック
      useEffect(() => {
        auth.signInAnonymously().catch(console.error);

        const savedPass = localStorage.getItem("omukae_passcode");
        if (savedPass === APP_PASSCODE) {
          setIsAuthenticated(true);
        }
        setAuthLoading(false);
      }, []);

      // データベース同期
      useEffect(() => {
        if (!isAuthenticated) return;
        const ref = db.ref("omukae_schedules");
        ref.on("value", (snapshot) => {
          setSchedule(snapshot.val() || {});
          setLoading(false);
        });
        return () => ref.off();
      }, [isAuthenticated]);

      const handlePassSubmit = (e) => {
        e.preventDefault();
        if (inputPass === APP_PASSCODE) {
          localStorage.setItem("omukae_passcode", inputPass);
          setIsAuthenticated(true);
          setPassError(false);
        } else {
          setPassError(true);
        }
      };

      const handleLogout = () => {
        localStorage.removeItem("omukae_passcode");
        setIsAuthenticated(false);
      };

      const persist = (next) => {
        setSchedule(next);
        db.ref("omukae_schedules").set(next);
      };

      if (authLoading) return (
        <div className="flex flex-col items-center justify-center h-screen" style={{background:"#FFF8F0"}}>
          <div className="text-5xl mb-3 animate-bounce">🚃</div>
          <div className="text-gray-400 text-sm">読み込み中...</div>
        </div>
      );

      // 合言葉入力画面
      if (!isAuthenticated) {
        return (
          <div className="min-h-screen flex items-center justify-center px-4" style={{background:"linear-gradient(160deg,#FFF8F0 0%,#F0F2FF 100%)"}}>
            <div className="bg-white rounded-3xl p-6 shadow-xl w-full max-w-xs text-center">
              <span className="text-4xl">🔐</span>
              <h1 className="text-lg font-bold text-gray-800 mt-2">合言葉を入力</h1>
              <p className="text-xs text-gray-400 mt-1 mb-5">おむかえ帳の暗証番号を入力してください</p>

              <form onSubmit={handlePassSubmit} className="space-y-4">
                <input
                  type="password"
                  inputMode="numeric"
                  autoFocus
                  placeholder="4桁の暗証番号"
                  value={inputPass}
                  onChange={(e) => setInputPass(e.target.value)}
                  className={`w-full border text-center text-xl tracking-widest rounded-xl px-3 py-2.5 focus:outline-none ${passError ? "border-red-400 bg-red-50" : "border-gray-200 focus:ring-2 focus:ring-orange-300"}`}
                />
                {passError && <p className="text-xs text-red-500">暗証番号が間違っています</p>}
                <button
                  type="submit"
                  className="w-full py-3 rounded-xl text-white text-sm font-bold shadow-md active:scale-95 transition-transform"
                  style={{background:"linear-gradient(135deg,#F06030,#C84070)"}}
                >
                  開く
                </button>
              </form>
            </div>
          </div>
        );
      }

      const year  = viewDate.getFullYear();
      const month = viewDate.getMonth();
      const monthPrefix = `${year}-${String(month+1).padStart(2,"0")}`;
      const todayKey = fmtKey(today.getFullYear(), today.getMonth(), today.getDate());

      const firstDOW    = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month+1, 0).getDate();
      const isCurrentMonth = today.getFullYear()===year && today.getMonth()===month;

      const shiftCounts = PEOPLE.reduce((acc, p) => {
        acc[p.id] = Object.entries(schedule).filter(
          ([k,v]) => k.startsWith(monthPrefix) && v.person===p.id && v.activity!=="holiday"
        ).length;
        return acc;
      }, {});

      const thisWeek = (() => {
        if (!isCurrentMonth) return [];
        const dow = today.getDay();
        const mon = new Date(today); mon.setDate(today.getDate() - (dow===0 ? 6 : dow-1));
        return Array.from({length:5}, (_,i) => {
          const d = new Date(mon); d.setDate(mon.getDate()+i);
          if (d.getMonth()!==month) return null;
          const day = d.getDate();
          const key = fmtKey(year, month, day);
          return { day, key, dow:d.getDay(), data:schedule[key] };
        }).filter(Boolean);
      })();

      const openEdit = (day) => {
        const dow = new Date(year,month,day).getDay();
        if (dow===0||dow===6) return;
        const key = fmtKey(year, month, day);
        setModal({ key, data: schedule[key] ? {...schedule[key]} : {...DEFAULT_DAY_DATA} });
      };

      const patchModal = (p) => setModal(prev => ({...prev, data:{...prev.data,...p}}));

      const saveModal = () => {
        if (!modal) return;
        persist({...schedule, [modal.key]: modal.data});
        setModal(null);
      };

      const claimShift = (key, personId) => {
        const existing = schedule[key] || {...DEFAULT_DAY_DATA};
        const next = { ...schedule, [key]: { ...existing, person: personId } };
        persist(next);
        if (modal && modal.key === key) setModal(null);
      };

      const applyMonthlyTemplate = () => {
        if (!window.confirm(`${MONTH_NAMES[month]}の平日に基本パターンを一括適用しますか？`)) return;
        const next = { ...schedule };
        for (let d = 1; d <= daysInMonth; d++) {
          const dow = new Date(year, month, d).getDay();
          if (dow === 0 || dow === 6) continue; 
          const key = fmtKey(year, month, d);
          if (!next[key]) {
            const template = WEEKLY_TEMPLATE[dow];
            if (template) next[key] = { ...template };
          }
        }
        persist(next);
      };

      const deleteModal = () => {
        if (!modal) return;
        const next = {...schedule}; delete next[modal.key];
        persist(next);
        setModal(null);
      };

      const personSchedule = (pid) =>
        Object.entries(schedule)
          .filter(([k,v]) => k.startsWith(monthPrefix) && v.person===pid && v.activity!=="holiday")
          .sort(([a],[b]) => a.localeCompare(b));

      if (loading) return (
        <div className="flex flex-col items-center justify-center h-screen" style={{background:"#FFF8F0"}}>
          <div className="text-5xl mb-3">🚃</div>
          <div className="text-gray-400 text-sm">データ取得中...</div>
        </div>
      );

      const todayData   = schedule[todayKey];
      const todayPerson = todayData?.person ? getPerson(todayData.person) : null;
      const todayAct    = todayData?.activity ? getActivity(todayData.activity) : null;
      
      // 今日の自宅受け入れ担当
      const isTodayFamisapo = todayData?.person?.startsWith("famisapo");
      const todayReceiver = todayData?.receiver ? getReceiver(todayData.receiver) : null;
      const todayReceiverLabel = todayData?.receiver === "other" 
        ? (todayData.receiverOther || "その他") 
        : todayReceiver?.label;

      return (
        <div className="min-h-screen pb-10" style={{background:"linear-gradient(160deg,#FFF8F0 0%,#F0F2FF 100%)"}}>
          <header style={{background:"linear-gradient(135deg,#F06030 0%,#C84070 100%)"}}>
            <div className="max-w-lg mx-auto px-4 pt-4 pb-4">
              <div className="flex items-center justify-between mb-2">
                <div className="flex items-center gap-2">
                  <span className="text-2xl">🚉</span>
                  <h1 className="text-lg font-bold text-white tracking-tight">おむかえ帳</h1>
                </div>
                <button
                  onClick={handleLogout}
                  className="bg-black/20 hover:bg-black/30 text-white text-[10px] px-2.5 py-1 rounded-full transition-colors"
                >
                  ロック
                </button>
              </div>

              <div className="flex justify-end gap-1 mb-3">
                {[["calendar","📅 月"],["shift","👥 人別"]].map(([t,l]) => (
                  <button key={t} onClick={()=>setTab(t)}
                    className={`px-3 py-1 rounded-full text-xs font-medium transition-all ${
                      tab===t ? "bg-white text-orange-600 font-bold" : "bg-white/20 text-white"
                    }`}>{l}</button>
                ))}
              </div>

              {/* 今日のお迎えバナー */}
              {isCurrentMonth && todayData && todayData.activity!=="holiday" && (
                <div className="bg-white/20 border border-white/30 rounded-2xl p-3 flex items-center gap-3">
                  <span className="text-3xl">{todayPerson?.emoji || "❓"}</span>
                  <div className="flex-1 min-w-0">
                    <p className="text-xs text-orange-100 font-medium">今日のおむかえ担当</p>
                    <p className="font-bold text-white text-base">
                      {todayPerson ? `${todayPerson.label}さん` : "❌ 担当者が決まっていません！"}
                      <span className="ml-2 font-normal text-orange-200 text-sm">{todayData.time}着</span>
                    </p>
                    
                    {/* ★ファミサポ時の自宅受け入れ担当を大きく表示 */}
                    {isTodayFamisapo && todayReceiverLabel && (
                      <p className="text-xs font-bold text-amber-200 mt-0.5 flex items-center gap-1">
                        <span>🏠 家で待つ人:</span>
                        <span className="bg-black/20 px-1.5 py-0.5 rounded text-white">{todayReceiverLabel}</span>
                      </p>
                    )}

                    <p className="text-xs text-orange-100 mt-0.5">
                      {todayAct?.emoji}&nbsp;
                      {todayData.activity==="lesson"&&todayData.lessonName ? todayData.lessonName : todayAct?.label}
                      {todayData.notes && <span className="ml-1 opacity-80">· {todayData.notes}</span>}
                    </p>
                  </div>
                  {!todayPerson && (
                    <div className="flex flex-col gap-1">
                      <button onClick={() => claimShift(todayKey, "mother")} className="bg-white text-rose-600 text-[10px] px-2 py-0.5 rounded font-bold shadow">母</button>
                      <button onClick={() => claimShift(todayKey, "father")} className="bg-white text-indigo-600 text-[10px] px-2 py-0.5 rounded font-bold shadow">父</button>
                    </div>
                  )}
                </div>
              )}
            </div>
          </header>

          <div className="max-w-lg mx-auto px-4 py-4">
            <div className="flex items-center justify-between mb-3 gap-2">
              <div className="flex items-center gap-2">
                <button onClick={()=>setViewDate(new Date(year,month-1,1))} className="w-8 h-8 flex items-center justify-center rounded-full bg-white shadow-sm text-gray-500">‹</button>
                <h2 className="font-bold text-gray-700 text-sm min-w-[80px] text-center">{year}年 {MONTH_NAMES[month]}</h2>
                <button onClick={()=>setViewDate(new Date(year,month+1,1))} className="w-8 h-8 flex items-center justify-center rounded-full bg-white shadow-sm text-gray-500">›</button>
              </div>
              <button onClick={applyMonthlyTemplate} className="bg-orange-50 hover:bg-orange-100 border border-orange-200 text-orange-700 text-xs font-bold px-2.5 py-1.5 rounded-xl shadow-sm transition-colors">
                ✨ 基本パターン流し込み
              </button>
            </div>

            <div className="grid grid-cols-4 gap-1.5 mb-4">
              {PEOPLE.map(p => (
                <div key={p.id} className="rounded-2xl py-1.5 px-1 text-center" style={{backgroundColor:p.light}}>
                  <div className="text-base">{p.emoji}</div>
                  <div className="text-[9px] font-medium truncate" style={{color:p.accent}}>{p.label}</div>
                  <div className="text-sm font-bold" style={{color:p.accent}}>{shiftCounts[p.id]}<span className="text-[10px] font-normal">回</span></div>
                </div>
              ))}
            </div>

            {/* ── カレンダービュー ── */}
            {tab==="calendar" && (
              <>
                {isCurrentMonth && thisWeek.length>0 && (
                  <div className="bg-white rounded-2xl shadow-sm p-3 mb-4">
                    <p className="text-xs font-bold text-gray-400 mb-2">今週のおむかえ</p>
                    <div className="flex gap-1.5">
                      {thisWeek.map(({day,key,dow,data}) => {
                        const p  = data?.person   ? getPerson(data.person)     : null;
                        const ac = data?.activity ? getActivity(data.activity) : null;
                        const isT = key===todayKey;
                        const isSeeking = data && !data.person && data.activity !== "holiday";
                        const isFs = data?.person?.startsWith("famisapo");
                        const rec = data?.receiver ? getReceiver(data.receiver) : null;
                        const recLabel = data?.receiver === "other" ? (data.receiverOther || "他") : rec?.label;

                        return (
                          <div key={key} onClick={()=>openEdit(day)} className={`flex-1 rounded-xl p-1.5 text-center cursor-pointer ${isT ? "ring-2 ring-orange-400" : ""}`} style={{backgroundColor: isSeeking ? "#FEF2F2" : (p&&data.activity!=="holiday" ? p.light : "#F8F8F8")}}>
                            <p className="text-[10px] text-gray-400">{DAY_NAMES[dow]}</p>
                            <p className="text-xs font-bold text-gray-700">{day}</p>
                            {ac && <p className="text-sm">{ac.emoji}</p>}
                            {isSeeking ? (
                              <p className="text-[9px] font-bold text-red-500 animate-pulse">⚠️SOS</p>
                            ) : p && data.activity!=="holiday" ? (
                              <div>
                                <p className="text-[9px] font-medium truncate" style={{color:p.accent}}>{p.label}</p>
                                {isFs && recLabel && (
                                  <p className="text-[8px] font-bold text-amber-700 leading-tight">家:{recLabel}</p>
                                )}
                              </div>
                            ) : (
                              <p className="text-gray-300 text-[10px]">―</p>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                <div className="bg-white rounded-2xl shadow-sm overflow-hidden">
                  <div className="grid grid-cols-7 border-b border-gray-50">
                    {DAY_NAMES.map((d,i) => (
                      <div key={d} className={`text-center text-[10px] py-1.5 ${i===0?"text-red-400":i===6?"text-indigo-400":"text-gray-400"}`}>{d}</div>
                    ))}
                  </div>
                  <div className="grid grid-cols-7">
                    {Array.from({length:firstDOW}).map((_,i) => <div key={`e${i}`} className="h-16 border-r border-b border-gray-50" />)}
                    {Array.from({length:daysInMonth}).map((_,i) => {
                      const day = i+1;
                      const dow = new Date(year,month,day).getDay();
                      const isWE = dow===0||dow===6;
                      const isT  = year===today.getFullYear()&&month===today.getMonth()&&day===today.getDate();
                      const key  = fmtKey(year,month,day);
                      const data = schedule[key];
                      const p    = data?.person   ? getPerson(data.person)     : null;
                      const ac   = data?.activity ? getActivity(data.activity) : null;
                      const isSeeking = data && !data.person && data.activity !== "holiday";
                      const isFs = data?.person?.startsWith("famisapo");
                      const rec = data?.receiver ? getReceiver(data.receiver) : null;
                      const recLabel = data?.receiver === "other" ? (data.receiverOther || "他") : rec?.label;

                      return (
                        <div key={day} onClick={()=>openEdit(day)} className={`h-16 border-r border-b border-gray-50 p-0.5 flex flex-col justify-between ${isWE ? "bg-gray-50" : `cursor-pointer ${isSeeking ? "bg-red-50/50" : "hover:bg-orange-50"}`} ${isT ? "ring-2 ring-orange-400 ring-inset" : ""}`}>
                          <div className={`text-[10px] flex items-center justify-center ${isT ? "w-4 h-4 rounded-full bg-orange-500 text-white font-bold" : "text-gray-600"}`}>{day}</div>
                          <div className="space-y-0.5">
                            {ac && <div className={`text-[8px] rounded px-0.5 truncate ${ac.bg} ${ac.text}`}>{ac.emoji}{ac.id==="lesson"&&data.lessonName ? data.lessonName : ac.label}</div>}
                            {isSeeking ? (
                              <div className="text-[8px] bg-red-100 text-red-700 font-bold rounded px-0.5 text-center animate-pulse">❓募集</div>
                            ) : p && data.activity!=="holiday" && (
                              <div className={`text-[8px] rounded px-0.5 truncate ${p.bg} ${p.text}`}>
                                {p.emoji}{p.label}
                                {isFs && recLabel && <span className="text-amber-800 font-bold ml-0.5">({recLabel})</span>}
                              </div>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </>
            )}

            {/* ── シフト（人別）ビュー ── */}
            {tab==="shift" && (
              <div className="space-y-3">
                {(() => {
                  const openShifts = Object.entries(schedule).filter(([k,v]) => k.startsWith(monthPrefix) && !v.person && v.activity!=="holiday").sort(([a],[b]) => a.localeCompare(b));
                  if (openShifts.length === 0) return null;
                  return (
                    <div className="bg-red-50 border border-red-200 rounded-2xl overflow-hidden">
                      <div className="bg-red-500 text-white px-3 py-1.5 text-xs font-bold flex items-center justify-between">
                        <span>📢 お迎え募集中（空きシフト）</span>
                        <span className="bg-white text-red-600 px-1.5 py-0.5 rounded-full text-[10px]">{openShifts.length}件</span>
                      </div>
                      <div className="divide-y divide-red-100 bg-white">
                        {openShifts.map(([key, data]) => {
                          const {month:km,day:kd} = parseKey(key);
                          const d = new Date(year,km,kd);
                          const ac = getActivity(data.activity);
                          return (
                            <div key={key} className="p-2 flex items-center justify-between text-xs">
                              <div>{km+1}/{kd}({DAY_NAMES[d.getDay()]}) <span className="font-mono text-gray-400">{data.time}</span> <span className="ml-1 text-gray-500">{ac?.emoji}{data.activity==="lesson"&&data.lessonName?data.lessonName:ac?.label}</span></div>
                              <div className="flex gap-1">
                                <button onClick={() => claimShift(key, "mother")} className="bg-rose-50 text-rose-700 px-1.5 py-0.5 rounded border border-rose-200 font-bold text-[10px]">母</button>
                                <button onClick={() => claimShift(key, "father")} className="bg-indigo-50 text-indigo-700 px-1.5 py-0.5 rounded border border-indigo-200 font-bold text-[10px]">父</button>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                })()}

                {PEOPLE.map(p => {
                  const days = personSchedule(p.id);
                  const isFs = p.id.startsWith("famisapo");

                  return (
                    <div key={p.id} className="bg-white rounded-2xl shadow-sm overflow-hidden text-xs">
                      <div className="px-3 py-2 flex items-center gap-2" style={{background:`linear-gradient(135deg,${p.accent}15,${p.accent}05)`}}>
                        <span className="text-xl">{p.emoji}</span>
                        <div><p className="font-bold text-gray-800">{p.label}のシフト ({days.length}回)</p></div>
                      </div>
                      {days.length===0 ? <div className="py-4 text-center text-gray-300">担当なし</div> : (
                        <div className="divide-y divide-gray-50 max-h-48 overflow-y-auto">
                          {days.map(([key,data]) => {
                            const {month:km,day:kd} = parseKey(key);
                            const d = new Date(year,km,kd);
                            const ac = getActivity(data.activity);
                            const rec = data?.receiver ? getReceiver(data.receiver) : null;
                            const recLabel = data?.receiver === "other" ? (data.receiverOther || "その他") : rec?.label;

                            return (
                              <div key={key} className="flex items-center px-3 py-1.5 justify-between">
                                <div className="w-16 flex-shrink-0">{km+1}/{kd}({DAY_NAMES[d.getDay()]})</div>
                                <div className="font-mono text-gray-400 w-10 flex-shrink-0">{data.time}</div>
                                <div className="flex-1 text-center truncate text-gray-500">
                                  {ac?.emoji}{data.activity==="lesson"&&data.lessonName?data.lessonName:ac?.label}
                                </div>
                                {isFs && recLabel && (
                                  <div className="text-[10px] bg-amber-50 text-amber-800 px-1.5 py-0.5 rounded border border-amber-200 flex-shrink-0">
                                    🏠家:{recLabel}
                                  </div>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          {/* ── 編集モーダル ── */}
          {modal && (
            <div className="fixed inset-0 bg-black/40 flex items-end justify-center z-50 text-sm" onClick={e=>e.target===e.currentTarget&&setModal(null)}>
              <div className="bg-white w-full max-w-lg rounded-t-3xl p-4 space-y-4 max-h-[85vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-bold text-gray-800">{(()=>{ const {month:km,day:kd} = parseKey(modal.key); return `${km+1}月${kd}日 (${DAY_NAMES[new Date(year,km,kd).getDay()]})`; })()}</h3>
                  <button onClick={()=>setModal(null)} className="text-xl text-gray-400">×</button>
                </div>
                
                {/* お休みトグル */}
                <div className="flex items-center justify-between bg-gray-50 p-2 rounded-xl">
                  <span className="text-xs font-medium">🌸 学校がお休みの日</span>
                  <button onClick={()=>patchModal({activity:modal.data.activity==="holiday"?"gakudo":"holiday"})} className={`w-10 h-5 rounded-full relative transition-colors ${modal.data.activity==="holiday"?"bg-orange-400":"bg-gray-200"}`}><span className={`absolute top-0.5 w-4 h-4 bg-white rounded-full shadow transition-all ${modal.data.activity==="holiday"?"left-5":"left-0.5"}`} /></button>
                </div>

                {modal.data.activity!=="holiday" && (
                  <>
                    {/* 駅お迎え時刻 */}
                    <div>
                      <label className="block text-xs font-medium mb-1">🚉 駅お迎え時刻</label>
                      <input type="time" value={modal.data.time||"15:00"} onChange={e=>patchModal({time:e.target.value})} className="w-full border rounded-xl p-2" />
                    </div>

                    {/* お迎え後の予定 */}
                    <div>
                      <label className="block text-xs font-medium mb-1">📋 お迎え後の予定</label>
                      <div className="grid grid-cols-3 gap-1.5">
                        {ACTIVITIES.filter(a=>a.id!=="holiday").map(act => (
                          <button key={act.id} onClick={()=>patchModal({activity:act.id})} className={`py-2 rounded-xl flex flex-col items-center border ${modal.data.activity===act.id ? `${act.bg} ${act.text} border-transparent font-bold` : "bg-white text-gray-400"}`}><span className="text-lg">{act.emoji}</span><span className="text-[10px]">{act.label}</span></button>
                        ))}
                      </div>
                      {modal.data.activity==="lesson" && <input type="text" placeholder="習い事名" value={modal.data.lessonName||""} onChange={e=>patchModal({lessonName:e.target.value})} className="mt-1 w-full border rounded-xl p-2 text-xs" />}
                    </div>

                    {/* お迎えする人 */}
                    <div>
                      <label className="block text-xs font-medium mb-1">👤 駅にお迎えする人</label>
                      <div className="grid grid-cols-5 gap-1">
                        <button onClick={()=>patchModal({person:""})} className={`py-2 rounded-xl border flex flex-col items-center ${modal.data.person==="" ? "bg-red-100 text-red-700 border-transparent font-bold" : "bg-white text-gray-400"}`}><span className="text-base">❓</span><span className="text-[9px] font-bold">未定募集</span></button>
                        {PEOPLE.map(p => (
                          <button key={p.id} onClick={()=>patchModal({person:p.id})} className={`py-2 rounded-xl border flex flex-col items-center ${modal.data.person===p.id ? `${p.bg} ${p.text} border-transparent font-bold` : "bg-white text-gray-400"}`}><span className="text-base">{p.emoji}</span><span className="text-[9px] font-bold truncate w-full text-center">{p.label}</span></button>
                        ))}
                      </div>
                    </div>

                    {/* ★ファミサポ選択時のみ表示：家で迎え入れる人（在宅担当） */}
                    {modal.data.person?.startsWith("famisapo") && (
                      <div className="bg-amber-50/70 border border-amber-200 rounded-2xl p-3 space-y-2 animate-fadeIn">
                        <label className="block text-xs font-bold text-amber-900 flex items-center gap-1">
                          <span>🏠</span> 家で迎え入れる人（在宅・受取担当）
                        </label>
                        <div className="grid grid-cols-3 gap-1.5">
                          {RECEIVERS.map(r => (
                            <button
                              key={r.id}
                              type="button"
                              onClick={() => patchModal({ receiver: r.id })}
                              className={`py-2 px-1 rounded-xl border flex items-center justify-center gap-1 text-xs font-bold transition-all ${
                                (modal.data.receiver || "mother") === r.id
                                  ? "bg-amber-500 text-white border-amber-600 shadow-sm scale-[1.02]"
                                  : "bg-white text-gray-600 border-gray-200 hover:bg-amber-100/50"
                              }`}
                            >
                              <span>{r.emoji}</span>
                              <span>{r.label}</span>
                            </button>
                          ))}
                        </div>

                        {/* 「その他」を選んだ場合の詳細入力 */}
                        {modal.data.receiver === "other" && (
                          <input
                            type="text"
                            placeholder="例：祖母、親戚など"
                            value={modal.data.receiverOther || ""}
                            onChange={e => patchModal({ receiverOther: e.target.value })}
                            className="w-full border border-amber-200 rounded-xl px-3 py-1.5 text-xs bg-white focus:outline-none focus:ring-2 focus:ring-amber-400"
                          />
                        )}
                        <p className="text-[10px] text-amber-700/80">※ファミサポさんが家に着いた時に子どもを受け取る人を指定します</p>
                      </div>
                    )}

                    {/* メモ */}
                    <div>
                      <label className="block text-xs font-medium mb-1">📝 メモ</label>
                      <input type="text" placeholder="メモ" value={modal.data.notes||""} onChange={e=>patchModal({notes:e.target.value})} className="w-full border rounded-xl p-2 text-xs" />
                    </div>
                  </>
                )}

                <div className="flex gap-2 pt-2">
                  {schedule[modal.key] && <button onClick={deleteModal} className="text-red-500 px-2 text-xs">削除</button>}
                  <button onClick={()=>setModal(null)} className="flex-1 bg-gray-100 py-2 rounded-xl text-gray-600 text-xs">消去</button>
                  <button onClick={saveModal} className="flex-1 text-white py-2 rounded-xl font-bold text-xs" style={{background:"linear-gradient(135deg,#F06030,#C84070)"}}>保存</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
